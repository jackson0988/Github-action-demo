name: Predict sample trips

# Adds a "Run workflow" button that predicts every trip in a CSV file (batch inference)
on:
  workflow_dispatch:
    inputs:
      file:
        description: "CSV file in the repo"
        default: "samples/trips.csv"

permissions:
  contents: read
  actions: read # to download the model from the CI workflow

jobs:
  batch-predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .

      # Use the model from the newest green CI run on main: the model that passed the check
      - name: Find the newest green CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then echo "No green CI run on main yet"; exit 1; fi
          echo "Using the model from CI run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: model
          path: model/
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Predict every trip in the file
        env:
          FILE: ${{ inputs.file }}
        run: python src/batch_predict.py "$FILE"

      # Download predictions.csv from the run page
      - uses: actions/upload-artifact@v7
        with:
          name: predictions
          path: predictions.csv
